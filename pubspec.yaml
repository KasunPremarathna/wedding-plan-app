name: wedding_planner_lk
description: A premium wedding planning app for Sri Lankan couples.
publish_to: 'none'
version: 1.0.2+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.4

  # HTTP Client
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1

  # Local Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0

  # UI Components
  carousel_slider: ^4.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  smooth_page_indicator: ^1.1.0
  flutter_rating_bar: ^4.0.1
  percent_indicator: ^4.2.3

  # Animations
  lottie: ^3.1.0
  flutter_animate: ^4.5.0

  # Utilities
  url_launcher: ^6.2.6
  intl: ^0.20.2
  image_picker: ^1.1.2
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.6
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.8.0
  upgrader: ^13.6.0
  pdf: ^3.12.0
  printing: ^5.14.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/translations/

  fonts:
    - family: NotoSansSinhala
      fonts:
        - asset: assets/fonts/NotoSansSinhala-Regular.ttf
        - asset: assets/fonts/NotoSansSinhala-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: "assets/images/splash_logo.png"
  android_12:
    image: "assets/images/splash_logo.png"
    color: "#FFFFFF"
